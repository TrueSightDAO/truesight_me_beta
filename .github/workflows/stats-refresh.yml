# Regenerates the `stats/*.json` LLM discovery indexes (current.json,
# beerhall_archive.json, repos_index.json, programs_index.json,
# partners_index.json, sunmint_index.json) from public DAO data sources so
# LLM agents (and any HTTP client) can read headline numbers without
# executing the landing page's JavaScript. Pairs with `llms.txt` which
# directs agents to these files.
#
# The script only reads public raw.github URLs — no credentials needed.
# Cron runs every 6 hours, offset from top-of-hour to avoid collision with
# the advisory-snapshot-refresh in go_to_market.

name: Stats refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate stats indexes
        run: python3 scripts/build_stats_current.py

      - name: Commit if changed
        run: |
          git config user.name 'truesight-me-stats-bot'
          git config user.email 'truesight-me-stats-bot@users.noreply.github.com'
          # Stage the whole stats/ directory: it holds ONLY generated
          # indexes (nothing hand-authored lives here), so a newly added
          # dimension (e.g. sunmint_index.json) ships automatically instead
          # of being dropped by a hand-maintained filename list.
          git add stats/
          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi
          git commit -m "chore(stats): refresh stats indexes [skip ci]"
          git push
