# Asserts every HTML page on truesight_me uses the shared JS nav pattern.
# Checks that all pages include the id="site-nav" placeholder instead of
# inline nav HTML. The old sync_top_nav.py check is replaced by this.
#
# Before 2026-07, the nav was duplicated inline and sync_top_nav.py enforced
# consistency. Now the shared js/nav.js injects the nav — all pages just need
# the placeholder.

name: Nav consistency

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify all pages use shared JS nav placeholder
        run: |
          set -e
          missing=0
          for f in $(find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -not -path './static/*' -not -path './assets/raw/*'); do
            if ! grep -q 'id="site-nav"' "$f"; then
              echo "MISSING site-nav placeholder: $f"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            echo ""
            echo "One or more pages are missing the shared nav placeholder."
            echo "Every page must include: <div id=\"site-nav\"></div>"
            exit 1
          fi
          echo "All pages have the shared nav placeholder."
