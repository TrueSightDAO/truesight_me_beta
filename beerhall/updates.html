<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) - only on truesight.me production -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (h !== 'truesight.me' && h !== 'www.truesight.me') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9QN16RFM0T';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-9QN16RFM0T');
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beer Hall digests | TrueSight DAO</title>
    <meta
      name="description"
      content="Published Beer Hall ecosystem digests from the TrueSight DAO git archive—paginated summaries with full text."
    />
    <link
      rel="icon"
      href="https://static.wixstatic.com/ficons/0e2cde_dd65db118f8f499eb06c159d7262167d%7Emv2.ico"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <div id="site-nav"></div>
<script src="/js/nav.js"></script>

    <div class="page ecosystem-updates-page">
      <header class="hero">
        <p class="pill">Transparency</p>
        <h1>Beer Hall digests</h1>
        <p class="section-lead">
          Short-form ecosystem notices archived in
          <a
            class="text-link"
            href="https://github.com/TrueSightDAO/ecosystem_change_logs"
            target="_blank"
            rel="noopener noreferrer"
            >TrueSightDAO/ecosystem_change_logs</a
          >. Join the live group via
          <a class="text-link" href="https://truesight.me/beerhall" target="_blank" rel="noopener noreferrer">Beer Hall chat</a>.
        </p>
      </header>

      <section aria-live="polite">
        <div id="updates-app">
          <p class="ecosystem-updates-status">Loading…</p>
        </div>
      </section>
    </div>

    <div id="site-footer"></div>
<script src="/js/footer.js"></script>

    <script src="../js/ecosystem-change-log-feed.js"></script>
    <script>
      (function () {
        var F = window.TrueSightEcosystemFeed;
        var app = document.getElementById('updates-app');
        if (!app || !F) return;

        function clearApp() {
          app.innerHTML = '';
        }

        function setStatus(html) {
          clearApp();
          var p = document.createElement('p');
          p.className = 'ecosystem-updates-status';
          p.innerHTML = html;
          app.appendChild(p);
        }

        function qsEntry() {
          var q = new URLSearchParams(window.location.search).get('entry') || '';
          return q.trim();
        }

        function qsPage() {
          var raw = new URLSearchParams(window.location.search).get('p') || '1';
          var n = parseInt(raw, 10);
          return !n || n < 1 ? 1 : n;
        }

        function renderDetail(rec) {
          clearApp();
          var back = document.createElement('p');
          back.className = 'ecosystem-detail-meta';
          var a = document.createElement('a');
          a.className = 'text-link';
          a.href = 'updates.html';
          a.textContent = '← All digests';
          back.appendChild(a);
          app.appendChild(back);

          var meta = document.createElement('p');
          meta.className = 'ecosystem-detail-meta';
          meta.appendChild(document.createTextNode(F.formatPostedAt(rec.posted_at_utc) + ' · '));
          var slug = document.createElement('strong');
          slug.textContent = String(rec.slug || 'update').replace(/-/g, ' ');
          meta.appendChild(slug);
          app.appendChild(meta);

          function block(title, body) {
            var wrap = document.createElement('div');
            wrap.className = 'ecosystem-detail-block';
            var h = document.createElement('h2');
            h.textContent = title;
            wrap.appendChild(h);
            var div = document.createElement('div');
            div.className = 'ecosystem-detail-body';
            div.textContent = body || '';
            wrap.appendChild(div);
            app.appendChild(wrap);
          }

          block('Message 1 (TLDR)', rec.message1_tldr);
          block('Message 2 (Shipped + community)', rec.message2_shipped);

          var links = rec.links;
          if (Array.isArray(links) && links.length) {
            var lw = document.createElement('div');
            lw.className = 'ecosystem-detail-block';
            var lh = document.createElement('h2');
            lh.textContent = 'Links';
            lw.appendChild(lh);
            var ul = document.createElement('ul');
            ul.className = 'ecosystem-detail-links';
            links.forEach(function (url) {
              if (!url || typeof url !== 'string') return;
              var li = document.createElement('li');
              var la = document.createElement('a');
              la.href = url;
              la.target = '_blank';
              la.rel = 'noopener noreferrer';
              la.textContent = url;
              li.appendChild(la);
              ul.appendChild(li);
            });
            lw.appendChild(ul);
            app.appendChild(lw);
          }

          var prs = rec.pr_commit_links;
          if (Array.isArray(prs) && prs.length) {
            var pw = document.createElement('div');
            pw.className = 'ecosystem-detail-block';
            var ph = document.createElement('h2');
            ph.textContent = 'PR / commit links';
            pw.appendChild(ph);
            var pul = document.createElement('ul');
            pul.className = 'ecosystem-detail-links';
            prs.forEach(function (url) {
              if (!url || typeof url !== 'string') return;
              var li = document.createElement('li');
              var la = document.createElement('a');
              la.href = url;
              la.target = '_blank';
              la.rel = 'noopener noreferrer';
              la.textContent = url;
              li.appendChild(la);
              pul.appendChild(li);
            });
            pw.appendChild(pul);
            app.appendChild(pw);
          }

          if (rec.notes) {
            var nw = document.createElement('div');
            nw.className = 'ecosystem-detail-block';
            var nh = document.createElement('h2');
            nh.textContent = 'Operator notes';
            nw.appendChild(nh);
            var nd = document.createElement('div');
            nd.className = 'ecosystem-detail-body';
            nd.textContent = String(rec.notes);
            nw.appendChild(nd);
            app.appendChild(nw);
          }

          if (rec.markdown_file) {
            var fw = document.createElement('p');
            fw.className = 'ecosystem-detail-meta';
            var fa = document.createElement('a');
            fa.className = 'text-link';
            fa.href = F.githubBlobUrl(rec.markdown_file);
            fa.target = '_blank';
            fa.rel = 'noopener noreferrer';
            fa.textContent = 'View Markdown on GitHub';
            fw.appendChild(fa);
            app.appendChild(fw);
          }

          if (rec.openclaw_message_id) {
            var oid = document.createElement('p');
            oid.className = 'ecosystem-detail-meta';
            oid.appendChild(document.createTextNode('OpenClaw: ' + String(rec.openclaw_message_id)));
            app.appendChild(oid);
          }
        }

        function renderList(pageDoc, manifest, pageNum) {
          clearApp();
          var entries = pageDoc.entries || [];
          if (!entries.length) {
            setStatus(
              'No published digests yet. When operators run the archiver, entries appear here. ' +
                '<a class="text-link" href="https://github.com/TrueSightDAO/ecosystem_change_logs/tree/main/beer_hall/entries" target="_blank" rel="noopener noreferrer">Browse the repo</a>.'
            );
            return;
          }

          var ul = document.createElement('ul');
          ul.className = 'ecosystem-updates-list';
          entries.forEach(function (e) {
            var stem = F.entryStemFromJsonPath(e.json_path || '');
            var li = document.createElement('li');
            li.className = 'ecosystem-updates-item';
            var link = document.createElement('a');
            link.className = 'ecosystem-updates-link';
            link.href = stem ? 'updates.html?entry=' + encodeURIComponent(stem) : 'updates.html';
            var time = document.createElement('time');
            if (e.posted_at_utc) time.dateTime = e.posted_at_utc;
            time.textContent = F.formatPostedAt(e.posted_at_utc);
            var title = document.createElement('span');
            title.className = 'ecosystem-updates-title';
            title.textContent = String(e.slug || 'update').replace(/-/g, ' ');
            var prev = document.createElement('span');
            prev.className = 'ecosystem-updates-preview';
            prev.textContent = e.preview || '';
            link.appendChild(time);
            link.appendChild(title);
            link.appendChild(prev);
            li.appendChild(link);
            ul.appendChild(li);
          });
          app.appendChild(ul);

          var pageCount = manifest.page_count || 1;
          var total = manifest.total != null ? manifest.total : entries.length;
          var nav = document.createElement('nav');
          nav.className = 'ecosystem-updates-pagination';
          nav.setAttribute('aria-label', 'Digest pages');

          var info = document.createElement('span');
          info.textContent = 'Page ' + pageNum + ' of ' + pageCount + ' · ' + total + ' total';
          nav.appendChild(info);

          if (pageNum > 1) {
            var prevA = document.createElement('a');
            prevA.href = 'updates.html?p=' + (pageNum - 1);
            prevA.textContent = '← Newer';
            nav.appendChild(prevA);
          }
          if (pageNum < pageCount) {
            var nextA = document.createElement('a');
            nextA.href = 'updates.html?p=' + (pageNum + 1);
            nextA.textContent = 'Older →';
            nav.appendChild(nextA);
          }

          app.appendChild(nav);
        }

        var entry = qsEntry();
        if (entry) {
          if (!F.isValidEntryStem(entry)) {
            setStatus('Invalid digest id. <a class="text-link" href="updates.html">Back to list</a>.');
            return;
          }
          F.loadEntryJson(entry)
            .then(renderDetail)
            .catch(function () {
              setStatus(
                'Could not load that digest. <a class="text-link" href="updates.html">Back to list</a> or open the ' +
                  '<a class="text-link" href="https://github.com/TrueSightDAO/ecosystem_change_logs/tree/main/beer_hall/entries" target="_blank" rel="noopener noreferrer">entries folder</a>.'
              );
            });
          return;
        }

        var pageNum = qsPage();
        Promise.all([F.loadManifest(), F.loadPage(pageNum)])
          .then(function (pair) {
            var manifest = pair[0];
            var pageDoc = pair[1];
            var max = manifest.page_count || 1;
            if (pageNum > max) {
              window.location.replace('updates.html?p=' + max);
              return;
            }
            renderList(pageDoc, manifest, pageNum);
          })
          .catch(function (err) {
            console.warn(err);
            setStatus(
              'Could not load the live feed. Try again on HTTPS (truesight.me), or open ' +
                '<a class="text-link" href="https://github.com/TrueSightDAO/ecosystem_change_logs/tree/main/beer_hall/feed" target="_blank" rel="noopener noreferrer">the feed on GitHub</a>.'
            );
          });
      })();

      (function () {
        var menuToggle = document.querySelector('.menu-toggle');
        var navMenu = document.querySelector('.nav-menu');
        var siteHeader = document.querySelector('.site-header');
        if (!menuToggle || !navMenu) return;

        menuToggle.addEventListener('click', function () {
          var isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
          menuToggle.setAttribute('aria-expanded', !isExpanded);
          navMenu.setAttribute('aria-hidden', isExpanded);
          siteHeader.classList.toggle('menu-open', !isExpanded);
        });

        var dropdownToggles = navMenu.querySelectorAll('.dropdown-toggle');
        dropdownToggles.forEach(function (toggle) {
          toggle.addEventListener('click', function (e) {
            if (window.innerWidth <= 768) {
              e.preventDefault();
              e.stopPropagation();
              var isEx = toggle.getAttribute('aria-expanded') === 'true';
              var dropdownMenu = toggle.nextElementSibling;
              toggle.setAttribute('aria-expanded', !isEx);
              if (dropdownMenu) dropdownMenu.setAttribute('aria-expanded', !isEx);
            }
          });
        });

        navMenu.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') {
            menuToggle.setAttribute('aria-expanded', 'false');
            navMenu.setAttribute('aria-hidden', 'true');
            siteHeader.classList.remove('menu-open');
            dropdownToggles.forEach(function (toggle) {
              toggle.setAttribute('aria-expanded', 'false');
              var dm = toggle.nextElementSibling;
              if (dm) dm.setAttribute('aria-expanded', 'false');
            });
          }
        });

        siteHeader.addEventListener('click', function (e) {
          if (e.target === siteHeader || e.target.classList.contains('site-header')) {
            menuToggle.setAttribute('aria-expanded', 'false');
            navMenu.setAttribute('aria-hidden', 'true');
            siteHeader.classList.remove('menu-open');
          }
        });
      })();
    </script>
  </body>
</html>
