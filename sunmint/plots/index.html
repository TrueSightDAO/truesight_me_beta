<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>SunMint Plot Explorer — plots, boundaries &amp; provenance</title>
<meta name="description" content="Full-viewport explorer for SunMint plots: boundaries, status, boundary authority and provenance. Beta." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --ink: #1c1a17; --muted: #6b645c; --line: #e4ddd3; --bg: #faf7f2; --panel: #ffffff;
    --accent: #2e7d32; --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg);
         display: flex; flex-direction: column; height: 100dvh; }
  /* #app fills whatever vertical space remains below the shared site nav (js/nav.js
     injects into #site-nav), so the nav never overlaps or clips the map. */
  #app { display: flex; flex: 1 1 auto; min-height: 0; width: 100%; overflow: hidden; }

  aside { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #rail-left { width: 300px; border-right: 1px solid var(--line); }
  #rail-right { width: 344px; border-left: 1px solid var(--line); }
  #map-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
  #map { position: absolute; inset: 0; background: #dfe6ea; }

  .rail-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .rail-head h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; }
  .rail-head .sub { font-size: 12px; color: var(--muted); }
  .rail-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; }

  .plot-item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .plot-item:hover { background: #f6f1e9; }
  .plot-item[aria-selected="true"] { background: #efe8db; box-shadow: inset 3px 0 0 var(--accent); }
  .plot-item .nm { font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
  .plot-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 1px 6px; border-radius: 10px; color: #fff; vertical-align: middle; }
  .chip.proposed { background: #e65100; } .chip.planted { background: #2e7d32; } .chip.verified { background: #1565c0; } .chip.none { background: #9e9e9e; }

  .detail { padding: 14px 16px; }
  .detail h2 { font-size: 15px; margin: 0 0 2px; }
  .detail .pid { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .detail dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; margin: 12px 0 0; }
  .detail dt { color: var(--muted); font-size: 12px; }
  .detail dd { margin: 0; font-size: 13px; word-break: break-word; }
  .detail .notes { margin-top: 12px; font-size: 12px; color: #4a443d; background: #f6f1e9; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
  .detail a { color: #1565c0; }
  .empty { color: var(--muted); font-size: 13px; padding: 16px; }
  .hint { font-size: 11px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--line); }
  .skipped { border-top: 1px solid var(--line); padding: 8px 16px 10px; font-size: 11.5px; color: #7a4b00; background: #fff8ec; }
  .skipped .skip-title { font-weight: 700; margin-bottom: 4px; }
  .skipped ul { margin: 0; padding-left: 16px; }

  /* PR3 filters */
  .filters { border-bottom: 1px solid var(--line); padding: 8px 12px 10px; }
  .reconcile { font-size: 11.5px; color: var(--muted); padding: 0 0 8px; }
  .reconcile b { color: var(--ink); }
  .facet { margin-bottom: 8px; }
  .facet .flabel { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .facet .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .opt { font-size: 11.5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; color: #4a443d; }
  .opt:hover { background: #f6f1e9; }
  .opt[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .opt .cnt { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .opt[aria-pressed="true"] .cnt { opacity: .85; }
  .opt.zero { opacity: .45; }
  .dq { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 7px; }
  .dq .opt[aria-pressed="true"] { background: #7a4b00; border-color: #7a4b00; }
  .dq .flabel { color: #7a4b00; }
  .noresult { padding: 14px 16px; color: var(--muted); font-size: 13px; }

  #status { position: absolute; left: 12px; top: 12px; z-index: 500; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #status.err { color: #b00020; border-color: #f2c3c8; background: #fff5f6; }

  @media (max-width: 820px) {
    body { height: auto; min-height: 100dvh; }
    #app { flex-direction: column; min-height: 0; overflow: visible; }
    #map-wrap { order: 1; width: 100%; height: 62vh; }
    #rail-left { order: 2; width: 100%; border-right: 0; border-top: 1px solid var(--line); }
    #rail-right { order: 3; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
    .rail-body { max-height: 46vh; }
  }
</style>
</head>
<body>
<div id="site-nav"></div>
<script src="/js/nav.js"></script>
<div id="app">
  <aside id="rail-left" aria-label="Plot list">
    <div class="rail-head">
      <h1>SunMint Plot Explorer</h1>
      <div class="sub" id="left-sub">Loading plots…</div>
    </div>
    <div class="filters" id="filters" aria-label="Plot filters" style="display:none"></div>
    <div class="rail-body" id="plot-list"></div>
    <div id="plot-skipped" class="skipped" style="display:none"></div>
  </aside>

  <main id="map-wrap">
    <div id="status" role="status">Loading plots…</div>
    <div id="map" aria-label="Plot map"></div>
  </main>

  <aside id="rail-right" aria-label="Plot detail">
    <div class="rail-head">
      <h1>Plot detail</h1>
      <div class="sub">Select a plot</div>
    </div>
    <div class="rail-body" id="detail">
      <div class="empty">Pick a plot from the list or click a boundary on the map.</div>
    </div>
    <div class="hint">Beta surface · plots only. Filters, media gallery, tree list and deep-links arrive in later units.</div>
  </aside>
</div>

<script>
/* SunMint Plot Explorer — shell (PR2).
 * Renders plots/index.geojson on a full-viewport map with a left plot rail and a
 * right detail panel. Data stays machine-generated (never hand-edited).
 * Scope of THIS unit: shell only — plots only. Filters = PR3, gallery/trees/provenance
 * links = PR4, deep-links (?plot=/?farm=/?tree=/?qr=) = PR5.
 * Conventions (basemap, CDN fallback, plot styling) mirror truesight_me_beta/sunmint.html.
 */
(function () {
  'use strict';

  var PLOTS_URLS = [
    'https://raw.githubusercontent.com/TrueSightDAO/sunmint/main/plots/index.geojson?cb=' + Date.now(),
    'https://cdn.jsdelivr.net/gh/TrueSightDAO/sunmint@main/plots/index.geojson'
  ];
  // Satellite basemap: ESRI World Imagery (free, no API key). maxNativeZoom 17 / maxZoom 19:
  // Esri has no sub-z17 coverage over most of the pilot area, so Leaflet upscales z17 tiles
  // for z18-z19 instead of requesting tiles that render as a grey wall (same as sunmint.html).
  // Per-plot media index (PR1 artifact). Fetched here so the "no media" data-quality state
  // reflects the gallery source of truth, not the rarely-populated geojson `media` prop.
  var MEDIA_URLS = [
    'https://raw.githubusercontent.com/TrueSightDAO/sunmint/main/plots/media.json?cb=' + Date.now(),
    'https://cdn.jsdelivr.net/gh/TrueSightDAO/sunmint@main/plots/media.json'
  ];
  var SATELLITE_BASEMAP = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  var CARTO_LIGHT = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  var PILOT_CENTER = [-3.2940, -52.5780];

  var ST_LABEL = { proposed: 'Proposed', planted: 'Planted', verified: 'Verified' };
  var ST_COLOR = { proposed: '#e65100', planted: '#2e7d32', verified: '#1565c0' };
  var BA_LABEL = { approx: 'Approx (photo hull)', gps_walk: 'GPS walk', car: 'CAR polygon', incra: 'INCRA polygon', 'walk-approx': 'GPS walk (approx)' };
  var PT_LABEL = { restoration: 'Restoration', mature: 'Mature', maturing: 'Maturing', enrichment: 'Enrichment', research: 'Research', nursery: 'Nursery', infrastructure: 'Infrastructure' };
  var FARM_SLUG = { 'santa-anna-fazenda': 'santa-anna-fazenda-para', 'rancho-maranta': 'rancho-maranta-para' };
  var PLOT_STYLE = {
    proposed: { weight: 2, dashArray: '6 4', fillOpacity: 0.10 },
    planted: { weight: 2, dashArray: null, fillOpacity: 0.18 },
    verified: { weight: 3, dashArray: null, fillOpacity: 0.32 }
  };
  var SEL_STYLE = { weight: 4, color: '#111111', fillOpacity: 0.38 };

  // Single escaper at IIFE scope (sunmint.html PR #363 precedent: a per-callback copy
  // caused an out-of-scope ReferenceError that silently killed the whole render).
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // --- data-quality helpers -------------------------------------------------
  function hasFarm(props) { return !!(props && props.farm_id); }
  function plotMediaCount(props) {
    // Source of truth is the PR1 media index; fall back to the geojson `media` prop
    // (only ~7 plots carry it) so the count still works if the index hasn't loaded.
    var id = props && (props.plot_id || props.id);
    if (mediaIndex && mediaIndex.has) {
      if (mediaIndex.has[id]) return 1; // presence is what the state needs; exact count comes from the gallery (PR4)
    }
    var g = props && props.media;
    return Array.isArray(g) ? g.length : 0;
  }
  function hasMedia(props) {
    if (mediaIndex && mediaIndex.has) return !!mediaIndex.has[props && (props.plot_id || props.id)];
    var g = props && props.media;
    return Array.isArray(g) && g.length > 0;
  }
  function isUnclassified(props) {
    var st = String((props && props.status) || '').toLowerCase();
    return !st || !ST_LABEL[st];
  }

  // --- faceted filtering (¤5: counts must reconcile, gaps must be visible) ----
  function facetValue(props, key) {
    var v = props ? props[key] : null;
    return (v == null || v === '') ? null : String(v); // null bucket = "Unclassified"
  }
  function passesFacets(props) {
    for (var k in filters) {
      if (!filters.hasOwnProperty(k)) continue;
      if (filters[k] == null) continue;
      var v = facetValue(props, k);
      if (filters[k] === '__unclassified__') { if (v != null) return false; }
      else if (v !== filters[k]) return false;
    }
    return true;
  }
  function passesOnly(props) {
    if (only['no-media'] && hasMedia(props)) return false;
    if (only['no-farm'] && hasFarm(props)) return false;
    if (only['unclassified'] && !isUnclassified(props)) return false;
    return true;
  }
  function isVisible(props) { return passesFacets(props) && passesOnly(props); }
  function visiblePlots() { return plotList.filter(function (p) { return isVisible(p.props); }); }

  function facetCounts(key) {
    // counts recompute from the rows passing the OTHER facets + the active data-quality flags,
    // so the number next to each option is exactly what clicking it will leave on screen.
    var c = {};
    plotList.forEach(function (p) {
      if (!passesOnly(p.props)) return;
      var ok = true;
      for (var k in filters) {
        if (!filters.hasOwnProperty(k) || k === key || filters[k] == null) continue;
        var v = facetValue(p.props, k);
        if (filters[k] === '__unclassified__') { if (v != null) ok = false; }
        else if (v !== filters[k]) ok = false;
      }
      if (!ok) return;
      var v = facetValue(p.props, key);
      var bucket = v == null ? '__unclassified__' : v;
      c[bucket] = (c[bucket] || 0) + 1;
    });
    return c;
  }

  var map = null;
  var layers = {};        // plot_id -> { layer, props, latlngs }
  var plotList = [];      // [{ id, props }] sorted for the rail
  var skipped = [];       // plots in the registry that could not be drawn (data-quality signal, §5)
  var selectedId = null;
  var mediaIndex = null;  // {has: Set(plot_id), generated_at, unattributed} | null until loaded
  // Faceted filters. Each facet key holds an active value (or null = All). `only` holds the
  // data-quality restrictors (§5: unclassified / no media / no farm).
  var filters = { farm_id: null, plot_type: null, status: null, boundary_authority: null };
  var only = { 'no-media': false, 'no-farm': false, 'unclassified': false };

  function $(id) { return document.getElementById(id); }

  function setStatus(msg, isErr) {
    var s = $('status');
    if (!s) return;
    if (!msg) { s.style.display = 'none'; return; }
    s.style.display = '';
    s.textContent = msg;
    s.className = isErr ? 'err' : '';
  }

  function centroid(latlngs) {
    var lat = 0, lng = 0, n = 0;
    latlngs.forEach(function (ll) { lat += ll[0]; lng += ll[1]; n++; });
    return n ? [lat / n, lng / n] : PILOT_CENTER;
  }

  function init() {
    map = L.map('map', { maxZoom: 19 }).setView(PILOT_CENTER, 11);
    var sat = L.tileLayer(SATELLITE_BASEMAP, {
      attribution: '&copy; Esri, Maxar, Earthstar Geographics',
      maxNativeZoom: 17, maxZoom: 19
    });
    var light = L.tileLayer(CARTO_LIGHT, { attribution: '&copy; OpenStreetMap &copy; CARTO' });
    sat.addTo(map);
    L.control.layers({ Satellite: sat, Light: light }, null, { position: 'topright' }).addTo(map);
    fetchPlots();
  }

  function fetchJsonChain(urls, i) {
    return fetch(urls[i]).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).catch(function (err) {
      if (i + 1 < urls.length) return fetchJsonChain(urls, i + 1);
      throw err;
    });
  }

  function fetchMediaIndex() {
    // Non-fatal: if the index is unreachable the explorer still works, but "no media" then
    // falls back to the geojson prop. We surface the failure in the reconcile line instead
    // of silently pretending every plot has media.
    return fetchJsonChain(MEDIA_URLS, 0).then(function (j) {
      var have = {};
      var plots = (j && j.plots) || {};
      Object.keys(plots).forEach(function (id) {
        var v = plots[id];
        var arr = v && v.media ? v.media : (Array.isArray(v) ? v : []);
        if (arr && arr.length) have[id] = arr.length;
      });
      mediaIndex = { has: have, generated_at: (j && j.generated_at) || null, counts: (j && j.counts) || null };
    }).catch(function () { mediaIndex = { has: null, generated_at: null, failed: true }; });
  }

  function fetchPlots() {
    fetchMediaIndex().then(function () { return fetchJsonChain(PLOTS_URLS, 0); }).then(renderPlots).catch(function (err) {
      setStatus('Could not load plots/index.geojson — ' + (err && err.message ? err.message : 'network error'), true);
      var sub = $('left-sub'); if (sub) sub.textContent = 'Failed to load';
      var list = $('plot-list');
      if (list) list.innerHTML = '<div class="empty">Plot data unavailable. Reload to retry.</div>';
    });
  }

  function renderPlots(geo) {
    var feats = (geo && geo.features) || [];
    var bounds = [];
    feats.forEach(function (f, idx) {
      var p = f.properties || {};
      var geom = f.geometry;
      if (!geom || geom.type !== 'Polygon') {
        // §5: never hide a registry row silently — record why it isn't drawn.
        skipped.push({ id: p.plot_id || p.id || ('plot_' + idx), name: p.name || '', reason: geom ? ('geometry type ' + geom.type) : 'no boundary geometry' });
        return;
      }
      var ring = (geom.coordinates && geom.coordinates[0]) || [];
      var latlngs = ring.map(function (c) { return [c[1], c[0]]; });
      if (!latlngs.length) return;
      var id = p.plot_id || p.id || ('plot_' + idx);
      var st = String(p.status || '').toLowerCase();
      var sty = PLOT_STYLE[st] || PLOT_STYLE.planted;
      var color = ST_COLOR[st] || '#7b1fa2';
      var layer = L.polygon(latlngs, {
        color: color, weight: sty.weight, dashArray: sty.dashArray,
        fillColor: color, fillOpacity: sty.fillOpacity
      }).addTo(map);
      layer.on('click', function () { select(id, true); });
      layers[id] = { layer: layer, props: p, latlngs: latlngs };
      plotList.push({ id: id, props: p });
      latlngs.forEach(function (ll) { bounds.push(ll); });
    });

    plotList.sort(function (a, b) {
      return String(a.props.name || a.id).localeCompare(String(b.props.name || b.id));
    });
    renderFilters();
    renderList();
    renderSkipped();
    setStatus('');
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
  }

  function facetOptions(key, label, order) {
    var counts = facetCounts(key);
    var keys = Object.keys(counts);
    // known values first, in declared order; then any unknown values alphabetically; null last
    var known = (order || []).filter(function (v) { return keys.indexOf(v) >= 0; });
    var extra = keys.filter(function (v) { return v !== '__unclassified__' && known.indexOf(v) < 0; }).sort();
    var hasNull = keys.indexOf('__unclassified__') >= 0;
    return { label: label, key: key, known: known.concat(extra), hasNull: hasNull, counts: counts };
  }

  function optEl(label, value, count) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (count === 0 ? ' zero' : '');
    b.setAttribute('aria-pressed', String(filters[this.key] === value));
    b.dataset.facet = this.key;
    b.dataset.value = value == null ? '' : value;
    b.innerHTML = esc(label) + '<span class="cnt">' + count + '</span>';
    var key = this.key;
    b.addEventListener('click', function () {
      filters[key] = (filters[key] === value) ? null : value;
      applyFilters();
    });
    return b;
  }

  function dqEl(id, label, count) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (count === 0 ? ' zero' : '');
    b.setAttribute('aria-pressed', String(!!only[id]));
    b.innerHTML = esc(label) + '<span class="cnt">' + count + '</span>';
    b.addEventListener('click', function () { only[id] = !only[id]; applyFilters(); });
    return b;
  }

  function renderFilters() {
    var host = $('filters');
    if (!host) return;
    host.style.display = '';
    host.innerHTML = '';

    // reconcile line
    var total = plotList.length;
    var vis = visiblePlots().length;
    var rec = document.createElement('div');
    rec.className = 'reconcile';
    rec.innerHTML = '<b>' + vis + '</b> of <b>' + total + '</b> plots shown' +
      (skipped.length ? ' · ' + skipped.length + ' undrawable' : '');
    if (mediaIndex && mediaIndex.failed) rec.innerHTML += ' · media index unavailable';
    else if (mediaIndex && mediaIndex.generated_at) rec.innerHTML += ' · media as of ' + esc(String(mediaIndex.generated_at).slice(0, 16).replace('T', ' ')) + 'Z';
    host.appendChild(rec);

    // farm (highest cardinality -> a <select> keeps the rail calm)
    var farms = facetCounts('farm_id');
    var fk = Object.keys(farms).filter(function (k) { return k !== '__unclassified__'; }).sort();
    var fwrap = document.createElement('div'); fwrap.className = 'facet';
    var fl = document.createElement('div'); fl.className = 'flabel'; fl.textContent = 'Farm'; fwrap.appendChild(fl);
    var sel = document.createElement('select');
    sel.className = 'opt'; sel.style.width = '100%'; sel.setAttribute('aria-label', 'Filter by farm');
    var allOpt = document.createElement('option');
    allOpt.value = ''; allOpt.textContent = 'All farms (' + Object.keys(plotFarms()).length + ')';
    sel.appendChild(allOpt);
    fk.forEach(function (v) {
      var o = document.createElement('option'); o.value = v;
      o.textContent = v + ' (' + farms[v] + ')';
      sel.appendChild(o);
    });
    if (farms['__unclassified__']) {
      var uo = document.createElement('option'); uo.value = '__unclassified__';
      uo.textContent = 'No farm (' + farms['__unclassified__'] + ')';
      sel.appendChild(uo);
    }
    sel.value = filters.farm_id == null ? '' : filters.farm_id;
    sel.addEventListener('change', function () { filters.farm_id = sel.value === '' ? null : sel.value; applyFilters(); });
    fwrap.appendChild(sel);
    host.appendChild(fwrap);

    // plot type / status / boundary authority -> chip rows
    function chipRow(title, key, order, labels) {
      var info = facetOptions(key, title, order);
      var wrap = document.createElement('div'); wrap.className = 'facet';
      var lb = document.createElement('div'); lb.className = 'flabel'; lb.textContent = title;
      wrap.appendChild(lb);
      var opts = document.createElement('div'); opts.className = 'opts';
      info.known.forEach(function (v) {
        var lbl = (labels && (labels[v] || labels[String(v).toLowerCase()])) || v;
        opts.appendChild(optEl.call({ key: key }, lbl, v, info.counts[v] || 0));
      });
      if (info.hasNull) opts.appendChild(optEl.call({ key: key }, 'Unclassified', '__unclassified__', info.counts['__unclassified__'] || 0));
      wrap.appendChild(opts);
      host.appendChild(wrap);
    }
    chipRow('Plot type', 'plot_type', ['restoration', 'mature', 'maturing', 'enrichment', 'research', 'nursery'], PT_LABEL);
    chipRow('Status', 'status', ['proposed', 'planted', 'verified'], ST_LABEL);
    chipRow('Boundary authority', 'boundary_authority', ['gps_walk', 'walk-approx', 'car', 'incra', 'approx'], BA_LABEL);

    // data-quality flags (¤5)
    var dq = document.createElement('div'); dq.className = 'facet dq';
    var dl = document.createElement('div'); dl.className = 'flabel'; dl.textContent = 'Data quality';
    dq.appendChild(dl);
    var dopts = document.createElement('div'); dopts.className = 'opts';
    var noMedia = plotList.filter(function (p) { return !hasMedia(p.props); }).length;
    var noFarm = plotList.filter(function (p) { return !hasFarm(p.props); }).length;
    var uncl = plotList.filter(function (p) { return isUnclassified(p.props); }).length;
    dopts.appendChild(dqEl('no-media', 'No media', noMedia));
    dopts.appendChild(dqEl('no-farm', 'No farm', noFarm));
    dopts.appendChild(dqEl('unclassified', 'Unclassified', uncl));
    dq.appendChild(dopts);
    host.appendChild(dq);
  }

  function applyFilters() {
    renderFilters();
    renderList();
    // hide/show map layers + refit to the visible set
    var bounds = [];
    plotList.forEach(function (p) {
      var e = layers[p.id]; if (!e) return;
      var vis = isVisible(p.props);
      if (vis) {
        if (!map.hasLayer(e.layer)) e.layer.addTo(map);
        e.latlngs.forEach(function (ll) { bounds.push(ll); });
      } else if (map.hasLayer(e.layer)) {
        map.removeLayer(e.layer);
      }
    });
    // if the selected plot just got filtered out, clear the detail panel
    if (selectedId && layers[selectedId] && !isVisible(layers[selectedId].props)) {
      selectedId = null;
      var d = $('detail');
      if (d) d.innerHTML = '<div class="empty">Pick a plot from the list or click a boundary on the map.</div>';
    }
    if (bounds.length) { try { map.fitBounds(bounds, { padding: [30, 30] }); } catch (e2) { /* keep */ } }
  }

  function renderSkipped() {
    var host = $('plot-skipped');
    if (!host) return;
    if (!skipped.length) { host.style.display = 'none'; host.innerHTML = ''; return; }
    host.style.display = '';
    var rows = skipped.map(function (sk) {
      return '<li><strong>' + esc(sk.name || sk.id) + '</strong> <span style="color:#6b645c">(' + esc(sk.id) + ')</span> \u2014 ' + esc(sk.reason) + '</li>';
    }).join('');
    host.innerHTML = '<div class="skip-title">' + skipped.length + ' plot' + (skipped.length === 1 ? '' : 's') + ' in the registry not drawn</div><ul>' + rows + '</ul>';
  }

  function plotFarms() {
    var f = {};
    plotList.forEach(function (p) { var id = p.props.farm_id; if (id) f[id] = 1; });
    return f;
  }

  function renderList() {
    var host = $('plot-list');
    if (!host) return;
    host.innerHTML = '';
    if (!plotList.length) {
      host.innerHTML = '<div class="empty">No plots in the registry yet.</div>';
      return;
    }
    var shown = visiblePlots();
    var sub = $('left-sub');
    if (sub) sub.textContent = shown.length + ' of ' + plotList.length + ' plots \u00b7 ' + Object.keys(plotFarms()).length + ' farms';
    if (!shown.length) {
      host.innerHTML = '<div class="noresult">No plots match the current filters. Clear a facet or a data-quality flag to see rows again.</div>';
      return;
    }
    shown.forEach(function (p) {
      var props = p.props;
      var st = String(props.status || '').toLowerCase();
      var item = document.createElement('div');
      item.className = 'plot-item';
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      item.setAttribute('aria-selected', 'false');
      item.dataset.plotId = p.id;

      var nm = document.createElement('div');
      nm.className = 'nm';
      var nameSpan = document.createElement('span');
      nameSpan.textContent = props.name || p.id;
      nm.appendChild(nameSpan);
      var chip = document.createElement('span');
      chip.className = 'chip ' + (ST_LABEL[st] ? st : 'none');
      chip.textContent = ST_LABEL[st] || (st || 'unclassified');
      nm.appendChild(chip);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var bits = [];
      if (props.hectares) bits.push(props.hectares + ' ha');
      if (props.farm_id) bits.push(props.farm_id);
      if (props.plot_type && PT_LABEL[String(props.plot_type).toLowerCase()]) bits.push(PT_LABEL[String(props.plot_type).toLowerCase()]);
      meta.textContent = bits.join(' · ') || p.id;

      item.appendChild(nm);
      item.appendChild(meta);
      item.addEventListener('click', function () { select(p.id, true); });
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(p.id, true); }
      });
      host.appendChild(item);
    });
  }

  function highlightList(id) {
    var items = document.querySelectorAll('#plot-list .plot-item');
    for (var i = 0; i < items.length; i++) {
      var on = items[i].dataset.plotId === id;
      items[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }

  function select(id, zoom) {
    var entry = layers[id];
    if (!entry) return;
    if (selectedId && layers[selectedId]) {
      var prev = layers[selectedId];
      var pst = String(prev.props.status || '').toLowerCase();
      var psty = PLOT_STYLE[pst] || PLOT_STYLE.planted;
      prev.layer.setStyle({
        color: ST_COLOR[pst] || '#7b1fa2', weight: psty.weight,
        dashArray: psty.dashArray, fillOpacity: psty.fillOpacity
      });
    }
    entry.layer.setStyle(SEL_STYLE);
    if (entry.layer.bringToFront) entry.layer.bringToFront();
    selectedId = id;
    highlightList(id);
    renderDetail(id, entry.props);
    if (zoom) {
      try { map.fitBounds(entry.layer.getBounds(), { padding: [40, 40], maxZoom: 17 }); } catch (e) { /* keep current view */ }
    }
  }

  function row(dl, label, value) {
    if (value == null || value === '') return;
    var dt = document.createElement('dt'); dt.textContent = label;
    var dd = document.createElement('dd'); dd.textContent = value;
    dl.appendChild(dt); dl.appendChild(dd);
  }

  function renderDetail(id, props) {
    var host = $('detail');
    if (!host) return;
    host.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'detail';

    var h2 = document.createElement('h2');
    h2.textContent = props.name || id;
    wrap.appendChild(h2);

    var pid = document.createElement('div');
    pid.className = 'pid';
    pid.textContent = id + (props.farm_id ? ' · ' + props.farm_id : '');
    wrap.appendChild(pid);

    var dl = document.createElement('dl');
    var st = String(props.status || '').toLowerCase();
    row(dl, 'Status', ST_LABEL[st] || (props.status || 'Unclassified'));
    var ba = props.boundary_authority || props.boundaryAuthority;
    if (ba) row(dl, 'Boundary', BA_LABEL[ba] || ba);
    var pt = props.plot_type || props.plotType;
    if (pt) row(dl, 'Plot type', PT_LABEL[String(pt).toLowerCase()] || pt);
    row(dl, 'Hectares', props.hectares != null ? String(props.hectares) : null);
    row(dl, 'Owner', props.owner);
    row(dl, 'Region', props.region);
    row(dl, 'Verified', props.verified_at);
    wrap.appendChild(dl);

    if (props.notes) {
      var n = document.createElement('div');
      n.className = 'notes';
      n.textContent = props.notes;
      wrap.appendChild(n);
    }

    // Provenance out-link: Agroverse farm profile (same slug convention as sunmint.html).
    if (props.farm_id) {
      var a = document.createElement('a');
      var slug = FARM_SLUG[props.farm_id] || props.farm_id;
      a.href = 'https://agroverse.shop/farms/' + encodeURIComponent(slug) + '/';
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'View farm profile on Agroverse ↗';
      var p = document.createElement('p');
      p.style.marginTop = '12px';
      p.appendChild(a);
      wrap.appendChild(p);
    }

    host.appendChild(wrap);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
